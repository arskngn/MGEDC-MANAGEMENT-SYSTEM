
server {
    listen __PORT__;
    root /var/www/public;
    index index.php index.html;

    charset utf-8;

    # Increase header buffers to handle large session cookies
    large_client_header_buffers 8 32k;
    client_header_buffer_size 32k;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/json application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # FastCGI buffer tuning
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;

    # Serve static assets directly
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires max;
        log_not_found off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
        fastcgi_send_timeout 120;
        fastcgi_connect_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
